<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f7ff"/>
    </linearGradient>
    <linearGradient id="porcelainBrown" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a2511"/>
      <stop offset="35%" stop-color="#7c3f1d"/>
      <stop offset="70%" stop-color="#9a5327"/>
      <stop offset="100%" stop-color="#4a2511"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.8"/>
    </pattern>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#bgGrad)"/>
  <rect width="600" height="400" fill="url(#gridPattern)" opacity="0.6"/>

  <rect x="0" y="0" width="600" height="42" fill="#ffffff" opacity="0.95"/>
  <line x1="0" y1="42" x2="600" y2="42" stroke="#e2e8f0" stroke-width="1.5"/>
  
  <rect x="24" y="11" width="20" height="20" rx="4" fill="#2563eb"/>
  <path d="M 34 14 L 29 22 L 33 22 L 31 28 L 39 19 L 34 19 Z" fill="#ffffff"/>
  <text x="52" y="25" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#0f172a" letter-spacing="0.5">PAVAN SAI POWER LINES</text>
  <text x="200" y="25" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#64748b">• HT/LT OVERHEAD LINE MATERIALS</text>

  <rect x="440" y="10" width="136" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <circle cx="452" cy="21" r="3.5" fill="#2563eb"/>
  <text x="462" y="25" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#1e40af">IS 1445 / 11kV-33kV</text>

  <g transform="translate(0, 20)">
    <!-- Top Conductor Groove (Crown) -->
    <path d="M 270 70 C 270 65, 330 65, 330 70 L 320 90 L 280 90 Z" fill="url(#porcelainBrown)" stroke="#2c1508" stroke-width="2"/>
    <ellipse cx="300" cy="70" rx="28" ry="7" fill="#2c1508"/>

    <!-- Porcelain Ribbed Sheds (3 Tiers) -->
    <!-- Top Shed -->
    <path d="M 220 115 C 220 90, 380 90, 380 115 L 360 145 C 330 135, 270 135, 240 145 Z" fill="url(#porcelainBrown)" stroke="#2c1508" stroke-width="2"/>
    <!-- Middle Shed -->
    <path d="M 200 155 C 200 135, 400 135, 400 155 L 380 190 C 340 175, 260 175, 220 190 Z" fill="url(#porcelainBrown)" stroke="#2c1508" stroke-width="2"/>
    <!-- Bottom Shed (Widest) -->
    <path d="M 180 200 C 180 175, 420 175, 420 200 L 390 235 C 345 220, 255 220, 210 235 Z" fill="url(#porcelainBrown)" stroke="#2c1508" stroke-width="2"/>

    <!-- Galvanized Steel Pin Shank -->
    <rect x="290" y="235" width="20" height="70" fill="url(#steelGrad)" stroke="#334155" stroke-width="2"/>
    <!-- Washer & Nut -->
    <rect x="275" y="285" width="50" height="12" rx="2" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/>
    <rect x="280" y="297" width="40" height="15" rx="2" fill="url(#steelGrad)" stroke="#334155" stroke-width="2"/>

    <text x="80" y="115" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1e40af">Glazed Porcelain Sheds</text>
    <line x1="180" y1="115" x2="225" y2="115" stroke="#2563eb" stroke-dasharray="3,3"/>
    <text x="440" y="260" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1e40af">Galvanized Steel Pin</text>
    <line x1="435" y1="260" x2="310" y2="260" stroke="#2563eb" stroke-dasharray="3,3"/>
  </g>

  <rect x="24" y="342" width="552" height="44" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)"/>
  <rect x="24" y="342" width="4" height="44" rx="2" fill="#2563eb"/>
  <text x="40" y="363" font-family="Poppins, Inter, sans-serif" font-size="13" font-weight="700" fill="#0f172a">HT Pin Insulator (11kV &amp; 33kV)</text>
  <text x="40" y="377" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#64748b">Verified Utility Specification • Secunderabad, Telangana Supply</text>
  <rect x="490" y="352" width="74" height="24" rx="6" fill="#2563eb"/>
  <text x="527" y="368" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">PSPL CERT</text>
</svg>
